# Both halves: enable ZMK's pointing (mouse) support
# Trackball / mouse support
CONFIG_ZMK_POINTING=y

# RGB lighting (underglow and per-key LEDs)
CONFIG_ZMK_RGB_UNDERGLOW=y
# Don't cut power to the screens and trackball when the lights are switched off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
# Turn the lights off after 30 s without use
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Deep sleep after 20 minutes without use
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery reporting and Bluetooth range
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
